<style>
/* css/base.css */
/* Colour tokens, reset, page background, links. */
:root{
  --bg:#07050a;--bg2:#100b14;--bg3:#1a1220;--panel:#120c17;--line:#2a1f33;
  --fg:#f2e9ff;--fg2:#9f8fb3;--fg3:#6b5f7d;--acc:#35e3ff;--acc2:#a45cff;--neon:#ff3fa4;--ok:#3ee0a0;--warn:#ffb347;
  --mono:"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
a{color:var(--acc)}
/* css/layout.css */
/* Header bar, tab strip, the main column, the next-button footer. */
header{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{margin:0;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
header h1 small{color:var(--fg3);letter-spacing:0;text-transform:none;font-weight:normal;margin-left:10px;font-size:13px}
.spacer{flex:1}
nav{display:flex;gap:4px;padding:8px 22px;border-bottom:1px solid var(--line);background:var(--bg2);overflow-x:auto}
nav button{border:none;background:transparent;color:var(--fg2);padding:8px 11px;border-radius:6px;white-space:nowrap}
nav button.on{background:var(--bg3);color:var(--fg)}
nav button .n{font-family:var(--mono);font-size:11px;color:var(--fg3);margin-left:6px}
nav button.done .n{color:var(--ok)}
nav .sep{width:1px;background:var(--line);margin:4px 4px}
main{max-width:980px;margin:0 auto;padding:24px 22px 80px}
.foot{display:flex;justify-content:space-between;margin-top:20px;align-items:center}
/* css/controls.css */
/* Form controls: selects, buttons, text inputs, field labels, kbd. */
select,button,input[type=text],input[type=date],textarea{background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
button{cursor:pointer}
button:hover{border-color:var(--acc2)}
button.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}
button.danger{border-color:#7a2a4a;color:var(--neon)}
button.sm{padding:2px 8px;font-size:12px}
textarea{width:100%;min-height:70px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--fg2)}
label.f{display:block;font-size:12px;color:var(--fg3);font-family:var(--mono);margin-top:8px}
.f+select,.f+input,.f+textarea{width:100%}
/* css/panels.css */
/* Cards and the question rows inside them: options, true/false rows, notes. */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:17px}
.card h3{margin:18px 0 6px;font-size:14px;color:var(--acc);text-transform:uppercase;letter-spacing:.08em}
.muted{color:var(--fg2)}
.tiny{color:var(--fg3);font-size:12px;font-family:var(--mono)}
.q{margin-bottom:22px}
.q .t{margin-bottom:8px}
.q .t b{color:var(--fg3);font-family:var(--mono);font-weight:normal;margin-right:8px}
.opt{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:7px;margin:5px 0;cursor:pointer;background:var(--bg2)}
.opt:hover{border-color:var(--acc2)}
.opt.on{border-color:var(--acc);background:#13202a}
.opt input{display:none}
.opt .k{font-family:var(--mono);color:var(--fg3);margin-right:8px;font-size:12px}
.ctx{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:10px;color:var(--fg2);margin-bottom:8px;margin-right:6px}
.likert{display:flex;gap:6px;flex-wrap:wrap}
.likert .opt{flex:1;text-align:center;min-width:100px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk .opt{margin:0}
.tf{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;margin:5px 0;background:var(--bg2)}
.tf .tft{flex:1;font-size:14.5px}.tf.straight{border-left:3px solid var(--ok)}
.tf .tfb{display:flex;gap:4px}.tf .tfb button{min-width:58px;padding:5px 8px;font-size:12.5px;font-family:var(--mono)}
.tf .tfb button.on.t{background:#12352a;border-color:var(--ok);color:var(--ok)}.tf .tfb button.on.f{background:#3a1a2a;border-color:var(--neon);color:var(--neon)}
.turned{margin:4px 0 0 12px;font-size:13px;color:var(--fg2)}
.turned button{margin-right:4px}
.turned button.on{border-color:var(--acc);color:var(--acc)}
.note{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--bg2)}
.note .h{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
/* css/results.css */
/* Report furniture: bars, tables, evidence lines, findings, validity stamp,
   change modules, check-in squares, the formula blocks. */
.bar{display:grid;grid-template-columns:230px 1fr 110px;gap:10px;align-items:center;margin:5px 0;font-size:14px}
.bar .tr{height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;position:relative}
.bar .fl{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.bar .fl.warn{background:linear-gradient(90deg,#a3542e,var(--warn))}
.bar .fl.ok{background:linear-gradient(90deg,#1f7a5c,var(--ok))}
.bar .mk{position:absolute;top:-2px;width:2px;height:14px;background:var(--neon)}
.bar .v{font-family:var(--mono);font-size:12px;color:var(--fg2);text-align:right}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--fg2);font-weight:normal;font-family:var(--mono);font-size:12px}
td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.ev{border-left:2px solid var(--line);padding:4px 12px;margin:6px 0;color:var(--fg2);font-size:13.5px}
.ev b{color:var(--fg);font-weight:normal}
.ev .src{font-family:var(--mono);font-size:11px;color:var(--fg3)}
.find{border-left:3px solid var(--neon);padding:8px 14px;margin:10px 0;background:var(--bg2);border-radius:0 8px 8px 0}
.find.ok{border-color:var(--ok)}
.find.warn{border-color:var(--warn)}
.find.bad{border-color:#ff3f3f}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg3);color:var(--fg2)}
.pill.self{color:var(--acc)}.pill.obs{color:var(--warn)}
pre.math{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12.5px;overflow-x:auto;color:var(--fg2);white-space:pre-wrap}
.stamp{display:inline-block;padding:4px 12px;border-radius:6px;font-family:var(--mono);font-weight:bold;letter-spacing:.08em}
.stamp.valid{background:#12352a;color:var(--ok)}.stamp.q{background:#3a2a12;color:var(--warn)}.stamp.invalid{background:#3a1212;color:#ff5f5f}
.mod{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--bg2)}
.mod h4{margin:0 0 4px;font-size:15px}
.ci{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ci span{width:22px;height:22px;border-radius:4px;background:var(--bg3);display:inline-block;border:1px solid var(--line);font-size:10px;text-align:center;line-height:20px;color:var(--fg3)}
.ci span.y{background:#1f7a5c;color:#fff}.ci span.n{background:#5a2a3a;color:#fff}
/* css/responsive.css */
/* Two- and three-column grids, and the one narrow-screen breakpoint.
   Loaded after the rest so the breakpoint still wins. */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.bar{grid-template-columns:130px 1fr 80px}}
/* css/print.css */
/* Printing the report. */
@media print{header,nav,.noprint{display:none}body{background:#fff;color:#000}.card{border-color:#ccc}.bar .fl{background:#888}.ev,.muted{color:#333}.find{background:#f4f4f4}}
</style>
</head>

<header>
  <h1>Undertow <small>behavioral profile · evidence edition</small></h1>
  <div class="spacer"></div>
  <label class="tiny">subject</label><select id="subjSel"></select>
  <span id="advHdr"><label class="tiny">rater</label><select id="raterSel"></select>
  <button id="newSubj" class="sm">+ subject</button>
  <button id="newRater" class="sm">+ observer</button>
  <button id="delRater" class="danger sm">delete rater</button></span>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script type="module">
/* ---- state.js ---- */
/* The saved database: load, save, subjects, raters. localStorage key lives here. */

const KEY="undertow.v3";

/* ============================================================ STATE */

let DB=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}
  const d={subjects:{},cur:{s:null,r:null}};
  return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function newSubject(){return {raters:{self:{label:"Self",kind:"self",a:{},told:{},turned:{},snapshots:[]}},log:[],notes:[],checkins:{},plan:null,created:Date.now()}}
function S(){return DB.subjects[DB.cur.s]}
function R(){return S().raters[DB.cur.r]}
function ensure(){
  if(!Object.keys(DB.subjects).length)DB.subjects["Me"]=newSubject();
  if(!DB.cur.s||!DB.subjects[DB.cur.s])DB.cur.s=Object.keys(DB.subjects)[0];
  if(!DB.cur.r||!S().raters[DB.cur.r])DB.cur.r="self";
  save();
}
ensure();
/* ---- util/dom.js ---- */
/* Two helpers used everywhere: $ (querySelector) and esc (HTML escaping). */

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ---- data/screens.js ---- */
/* Published screens: PHQ-9, GAD-7 and the adapted attachment items. */

/* ---------- SCREENS: PHQ-9 and GAD-7 (public domain); attachment short form (adapted) ---------- */
const PHQ = ["Little interest or pleasure in doing things","Feeling down, depressed, or hopeless","Trouble falling or staying asleep, or sleeping too much","Feeling tired or having little energy","Poor appetite or overeating","Feeling bad about yourself, or that you are a failure or have let yourself or your family down","Trouble concentrating on things, such as reading the newspaper or watching television","Moving or speaking so slowly that other people could have noticed, or the opposite: being so fidgety or restless that you have been moving around a lot more than usual","Thoughts that you would be better off dead, or of hurting yourself in some way"];
const GAD = ["Feeling nervous, anxious, or on edge","Not being able to stop or control worrying","Worrying too much about different things","Trouble relaxing","Being so restless that it is hard to sit still","Becoming easily annoyed or irritable","Feeling afraid, as if something awful might happen"];
const FREQ = ["Not at all","Several days","More than half the days","Nearly every day"];
const ATT = [ // adapted two-dimension attachment items; anx = anxiety, avo = avoidance; r = reverse
 {t:"I worry that the people I'm close to don't really care about me as much as I care about them.",d:"anx"},
 {t:"I need a lot of reassurance that I'm loved.",d:"anx"},
 {t:"When someone I'm close to is out of contact, I worry they're losing interest.",d:"anx"},
 {t:"I get frustrated when people aren't available when I need them.",d:"anx"},
 {t:"I rarely worry about being abandoned.",d:"anx",r:1},
 {t:"I worry a lot about my relationships.",d:"anx"},
 {t:"I prefer not to show how I feel deep down.",d:"avo"},
 {t:"I find it difficult to depend on other people.",d:"avo"},
 {t:"I'm comfortable sharing private thoughts and feelings with people I'm close to.",d:"avo",r:1},
 {t:"I pull back when someone gets too close.",d:"avo"},
 {t:"It's easy for me to turn to people I'm close to when I need to.",d:"avo",r:1},
 {t:"I get uncomfortable when someone wants to be very close to me.",d:"avo"}
];
const AGR = ["Strongly disagree","Disagree","Slightly disagree","Neutral","Slightly agree","Agree","Strongly agree"];
/* ---- answers.js ---- */
/* Reading answers out of a rater: which items are touched, how many are done. */


const opt=(r,q,j)=>r.a[q.id+"_"+j];
const touched=(r,q)=>q.o?q.o.some((_,j)=>opt(r,q,j)!=null):r.a[q.id]!=null;
const trues=(r,q)=>q.o.map((_,j)=>j).filter(j=>opt(r,q,j)===1);
const answered=(qs,r=R())=>qs.filter(q=>touched(r,q)).length;

const scrN=(r=R())=>PHQ.filter((_,i)=>r.a["P"+i]!=null).length+GAD.filter((_,i)=>r.a["G"+i]!=null).length+ATT.filter((_,i)=>r.a["A"+i]!=null).length;
const SCR_TOTAL=PHQ.length+GAD.length+ATT.length;
/* ---- data/gaslighting.js ---- */
/* Gaslighting-marker scale: the seven Klein-grid markers, both directions, plus the message lexicon for them. */

/* ============================================================
   GASLIGHTING-PATTERN MARKERS
   Categories from Sweet (2019), Klein, Li & Wood (2023), Abramson (2014), Stern (2007).
   Measured as frequency of specific behaviors in disputes, in both directions
   (subject toward others; others toward subject). Output is a marker index and
   a band. It does not label anyone; a band describes a pattern in the evidence.
   ============================================================ */
const GL = {
  DENY:{n:"Denying events",d:"'That never happened', 'I never said that', 'you're making it up'."},
  MEM:{n:"Questioning memory",d:"'You're remembering it wrong', 'you're confused', 'you forgot'."},
  TRIV:{n:"Trivializing the reaction",d:"'You're overreacting', 'too sensitive', 'dramatic', 'calm down'."},
  PATH:{n:"Pathologizing",d:"'You're crazy', 'paranoid', 'you need help', 'delusional'."},
  ISOL:{n:"Isolating claims",d:"'Everyone thinks you...', 'nobody else would put up with...'."},
  WITH:{n:"Withholding",d:"'I'm not discussing this', 'drop it', refusing to engage with a stated concern."},
  REFR:{n:"Reframing what was said",d:"'I was joking', 'you took it wrong', 'that's not what I meant' used to replace rather than clarify."}
};
const GLFREQ=["Never","Rarely (once or twice)","Sometimes (a few times a year)","Often (monthly or more)","Routinely (most disputes)"];
// Subject-as-actor items (answerable by self or observer)
const QG = [
 {id:"G1",g:"DENY",t:"When confronted with something you said or did, you say it never happened or you never said it, when it did."},
 {id:"G2",g:"MEM",t:"In a disagreement about what happened, you tell the other person they're remembering it wrong or are confused."},
 {id:"G3",g:"TRIV",t:"When someone is upset by something you did, you tell them they're overreacting or too sensitive."},
 {id:"G4",g:"PATH",t:"In arguments you call the other person crazy, paranoid, unstable, or say they need help."},
 {id:"G5",g:"ISOL",t:"You tell the other person that everyone else agrees with you about them, or that no one else would put up with them."},
 {id:"G6",g:"WITH",t:"When someone raises a concern, you refuse to discuss it and treat the raising of it as the problem."},
 {id:"G7",g:"REFR",t:"After saying something hurtful, you say you were joking or they took it wrong, instead of addressing what was said."},
 {id:"G8",g:"DENY",t:"You have told someone that something they saw or heard didn't happen the way they think, knowing it did."}
];
// Subject-as-target items (the Klein et al. direction: what is done to the subject)
const QGT = [
 {id:"T1",g:"DENY",t:"Someone close to you tells you things didn't happen that you know happened."},
 {id:"T2",g:"MEM",t:"Someone close to you tells you your memory is unreliable, to the point that you have started doubting it."},
 {id:"T3",g:"TRIV",t:"When you're upset, someone close to you tells you you're overreacting, and you end up apologizing for being upset."},
 {id:"T4",g:"PATH",t:"Someone close to you calls you crazy, unstable, or paranoid during disagreements."},
 {id:"T5",g:"ISOL",t:"Someone close to you tells you that other people think badly of you, or discourages you from checking with them."},
 {id:"T6",g:"WITH",t:"When you raise a concern, someone close to you refuses to engage and makes the raising of it the issue."}
];
const LEXGL = {
 DENY:[/\bthat (never|didn'?t) happen/,/\bi never said (that|anything)/,/\byou'?re making (that|it|things) up\b/,/\bi (didn'?t|never) (say|do) that\b/,/\bthat'?s not what happened\b/,/\bnever happened\b/],
 MEM:[/\byou'?re remembering (it|that) wrong\b/,/\byour memory\b/,/\byou don'?t remember (it )?(right|correctly)\b/,/\byou'?re confused\b/,/\byou forgot\b/,/\byou imagined\b/,/\byou must have dreamt\b/],
 TRIV:[/\byou'?re (over ?reacting|being dramatic|so dramatic|too sensitive|being sensitive|so sensitive)\b/,/\bcalm down\b/,/\brelax,? it'?s\b/,/\bit'?s not that (deep|serious)\b/,/\byou'?re making a big deal\b/,/\bget over it\b/],
 PATH:[/\byou'?re (crazy|insane|psycho|delusional|paranoid|unstable|mental|nuts)\b/,/\byou need (help|therapy|meds)\b/,/\bsomething('?s| is) wrong with you\b/,/\byou'?re (sick|not well) in the head\b/],
 ISOL:[/\beveryone (thinks|says|knows|agrees)\b/,/\bnobody (else )?(would|likes|wants|believes)\b/,/\bno one (else )?(would|likes|wants|believes)\b/,/\beven your (mom|mother|dad|father|sister|brother|friends?) (thinks?|says?|agrees?)\b/,/\bthey all think\b/],
 WITH:[/\bi'?m not (discussing|talking about|doing) this\b/,/\bnot having this conversation\b/,/\bdrop it\b/,/\bi'?m done (talking|with this)\b/,/\bend of (discussion|conversation)\b/,/\bwe'?re not talking about (this|that)\b/],
 REFR:[/\bi was (just )?(joking|kidding)\b/,/\byou took (it|that) (the )?wrong( way)?\b/,/\bthat'?s not what i meant\b/,/\byou'?re twisting\b/,/\byou'?re putting words in my mouth\b/]
};
/* ---- data/orientation.js ---- */
/* Orientation item pairs and the domains they cover. */

/* ---------- orientation as paired true/false ---------- */
const OPAIRS=[
 {k:"beh",t:"I have had sexual contact with {X}."},
 {k:"beh",t:"I have had sexual contact with {X} in the last 12 months."},
 {k:"beh",t:"I have initiated or pursued sexual contact with {X}."},
 {k:"beh",t:"I have had a sexual relationship, more than one encounter, with {X}."},
 {k:"beh",t:"I have kissed or been physically affectionate with {X} outside of sex."},
 {k:"beh",t:"My first sexual experience was with {X}."},
 {k:"attr",t:"I am sexually attracted to {X}."},
 {k:"attr",t:"I have fantasized about {X} while alone in the last year."},
 {k:"attr",t:"I seek out sexual material featuring {X}."},
 {k:"attr",t:"{X} can reliably arouse me."},
 {k:"attr",t:"I notice {X} in a sexual way in everyday settings."},
 {k:"emo",t:"I have fallen in love with {X}."},
 {k:"emo",t:"I have wanted a romantic relationship with {X}."},
 {k:"ideal",t:"If nobody would know and nothing would follow from it, I would have sex with {X}."},
 {k:"ideal",t:"If nobody would know and nothing would follow from it, I would want a relationship with {X}."},
 {k:"label",t:"Asked directly, I would say I am attracted to {X}."},
 {k:"label",t:"I have told someone I am attracted to {X}."},
 {k:"hide",t:"I have hidden attraction to or contact with {X} from people close to me."},
 {k:"hide",t:"I have denied attraction to {X} when I felt it."},
 {k:"sought",t:"My sexual contact with {X} has only happened when it was offered; I have never sought it."}
];
const ODOM={beh:"Behavior",attr:"Attraction",emo:"Emotional",ideal:"Ideal (no consequences)",label:"Self-label",hide:"Concealment",sought:"Only when offered"};
const QO=[];OPAIRS.forEach((p,i)=>{QO.push({id:"OS"+i,k:p.k,side:"same",t:p.t.replace("{X}","someone of the same sex")});QO.push({id:"OO"+i,k:p.k,side:"other",t:p.t.replace("{X}","someone of the other sex")})});
/* ---- data/questions.js ---- */
/* Question banks for insecurities, deception, love language, emotion and self-view. */

/* ---------- INSECURITY ITEMS ---------- */
const QI = [
 {id:"I1",t:"A friend hasn't replied to your message in two days. What do you actually do?",tests:["AB","DS","MA"],o:[
  {t:"Send another message, or check whether they've been online.",w:{AB:1.1}},
  {t:"Assume I said something wrong and reread what I sent.",w:{DS:.9,AB:.5}},
  {t:"Decide I don't care and stop reaching out first.",w:{AB:.8,MA:.5}},
  {t:"Nothing. They're busy.",w:{}}]},
 {id:"I2",t:"Someone compliments something you made. First internal reaction?",tests:["FA","US","MA","DS"],o:[
  {t:"Point out the flaws in it.",w:{US:1.1,DS:.6}},
  {t:"Wonder what they want.",w:{MA:1.1}},
  {t:"Feel good, then worry I can't repeat it.",w:{FA:1.1,US:.5}},
  {t:"Take it.",w:{}}]},
 {id:"I3",t:"Which of these would bother you most if it happened tomorrow?",tests:["AB","FA","SS","VH","DS"],o:[
  {t:"Partner or close friend goes quiet and distant for a week.",w:{AB:1.1}},
  {t:"Someone I respect publicly corrects my mistake.",w:{FA:.9,DS:.6}},
  {t:"Someone I trust says 'you're a lot to deal with.'",w:{SS:1.1}},
  {t:"Plans change at the last minute and I wasn't consulted.",w:{VH:1.1}},
  {t:"Someone finds a private thing I wrote.",w:{DS:1.1}}]},
 {id:"I4",t:"When you need help with something, what usually happens?",tests:["SS","SB","ED"],o:[
  {t:"I don't ask. I figure it out or go without.",w:{SS:.9,ED:.7}},
  {t:"I ask, but apologize several times.",w:{SS:1.1}},
  {t:"I ask, and make it sound smaller than it is.",w:{SS:.6,SB:.6}},
  {t:"I ask.",w:{}}]},
 {id:"I5",t:"You walk into a room where people are already talking. First thought?",tests:["DS","AS","FA","VH"],o:[
  {t:"Whether they were talking about me.",w:{DS:1.1,MA:.5}},
  {t:"Whether I look okay.",w:{AS:1.1}},
  {t:"How to get the conversation onto something I know.",w:{FA:.8,VH:.6}},
  {t:"Where the exit is / how long I have to stay.",w:{DS:.6}},
  {t:"Nothing in particular.",w:{}}]},
 {id:"I6",t:"Someone close to you succeeds at something you also wanted. Honest reaction?",tests:["AS","FA","AB"],o:[
  {t:"Happy for them, then a private sting about where I'm at.",w:{AS:.9,FA:.6}},

function scoreOrient(r){

  return {d,n};
}

/* Scores the incident log and finds where it contradicts the questionnaire. */



/* --- incident log scoring --- */
function scoreLog(sub){
  const m={},ctx={},sch={},emo={};let n=0,straight=0;
  for(const c in CTX)ctx[c]={total:0,straight:0};
  for(const e of sub.log){n++;if(e.ctx&&ctx[e.ctx])ctx[e.ctx].total++;
    if(e.method==="straight"){straight++;if(e.ctx&&ctx[e.ctx])ctx[e.ctx].straight++}else if(e.method){m[e.method]=(m[e.method]||0)+1}
    if(e.schema)sch[e.schema]=(sch[e.schema]||0)+1;
    if(e.emo&&e.mode){emo[e.emo]=emo[e.emo]||{n:0,modes:{}};emo[e.emo].n++;emo[e.emo].modes[e.mode]=(emo[e.emo].modes[e.mode]||0)+1}}
  return {n,straight,m,ctx,sch,emo};
}
function contradictions(r,sub){
  const out=[];if(!sub.log.length)return out;
  const L=scoreLog(sub),D=scoreDeception(r),I=scoreInsecurity(r),E=scoreEmotion(r);
  for(const c in CTX){const q=D.ctx[c],l=L.ctx[c];if(q.total>=3&&l.total>=2){const qr=q.honest/q.total,lr=l.straight/l.total;
    if(qr-lr>=0.4)out.push(`Questionnaire says ${Math.round(qr*100)}% straight with ${CTX[c].toLowerCase()}; the incident log shows ${l.straight}/${l.total}.`)}}
  for(const k in L.m){if(L.m[k]>=2&&D.m[k].n<1)out.push(`${DEC[k].n} appears ${L.m[k]}× in the log but never in questionnaire answers.`)}
  for(const k in L.sch){if(L.sch[k]>=2&&I[k].post<0.3)out.push(`${SCHEMA[k].n} was tagged as the trigger in ${L.sch[k]} logged incidents but scores only ${Math.round(I[k].post*100)}% on the questionnaire.`)}
  for(const k in L.emo){const le=L.emo[k],qe=E.e[k];if(le.n>=2&&qe.n>=2){const lr=(le.modes.direct||0)/le.n,qr=(qe.modes.direct||0)/qe.n;if(qr-lr>=0.4)out.push(`${EMO[k]}: questionnaire says direct ${Math.round(qr*100)}% of the time; log shows ${le.modes.direct||0}/${le.n}.`)}}
  return out;
}

  <tr><td>Lie scale (implausible virtues endorsed)</td><td class="num">${V.lie}/${V.lieN}</td><td>${V.lieN<4?"not enough items answered":V.lie>=6?"idealized responding":V.lie>=4?"elevated":"normal range"}</td></tr>
  <tr><td>Inconsistency (reworded items answered differently)</td><td class="num">${V.inc}/${V.incN}</td><td>${V.incN<3?"not enough pairs answered":V.inc>=3?"answers don't hold up under rewording":V.inc>=2?"some drift":"consistent"}${V.incItems.length?" · items "+V.incItems.join(", "):""}</td></tr>
  <tr><td>Straight-answer rate on deception items</td><td class="num">${pct(V.straight)}</td><td>${V.straight==null?"—":V.straight>=0.85?"unusually high; DePaulo's diary data puts everyday deception well above this":V.straight<=0.15?"unusually low":"plausible range"}</td></tr>
  <tr><td>Yes-saying (share of statements marked true)</td><td class="num">${V.aq.n?Math.round(V.aq.rate*100)+"%":"–"}</td><td>${V.aq.n<60?"not enough statements answered":V.aq.rate>=0.75?"acquiescent responding":V.aq.rate<=0.06?"nay-saying":"normal range"}</td></tr>
  ${isObs()?`<tr><td>Observer: deception items skipped as unverified</td><td class="num">${D.unverified}</td><td>only confirmed gaps were scored</td></tr>`:""}</table>
  ${V.verdict!=="valid"?`<div class="find ${V.verdict==="invalid"?"bad":"warn"}">${V.reasons.join(". ")}. ${V.verdict==="invalid"?"Trait results below are shown but should not be trusted. Redo the sections, or hand them to an observer.":"Read the trait results with that in mind; an observer's answers would settle it."}</div>`:`<p class="muted">${V.reasons.length?V.reasons.join(". ")+".":"Validity checks within range."}</p>`}
  </div>`;

  /* pattern */
  const insRank=Object.entries(I).sort((a,b)=>b[1].post-a[1].post);
  const decRank=Object.entries(D.m).sort((a,b)=>b[1].n-a[1].n);
  const topIns=insRank[0],topDec=decRank[0];
  const ctxRank=Object.entries(D.ctx).filter(([k,c])=>c.total>=2).sort((a,b)=>(a[1].honest/a[1].total)-(b[1].honest/b[1].total));
  const leastHonest=ctxRank[0];
  const emoRank=Object.entries(E.e).filter(([k,e])=>e.n>=2).map(([k,e])=>[k,(e.modes.direct||0)/e.n,e]).sort((a,b)=>a[1]-b[1]);
  h+=`<div class="card"><h2>The pattern</h2>`;
  if(topIns&&topIns[1].n>=3&&topIns[1].post>0.5)h+=`<div class="find">Strongest insecurity signal: <b>${SCHEMA[topIns[0]].n}</b> (${pct(topIns[1].post)} posterior from ${topIns[1].n} items). ${SCHEMA[topIns[0]].d}</div>`;
  if(topDec&&topDec[1].n>=2)h+=`<div class="find">When a straight answer costs something ${isObs()?esc(DB.cur.s)+" was seen to reach for":"you most often reach for"} <b>${DEC[topDec[0]].n}</b>${leastHonest?`, least straight with <b>${CTX[leastHonest[0]]}</b> (${leastHonest[1].honest}/${leastHonest[1].total} straight)`:""}. Straight option in ${D.honest} of ${D.total} scored situations (${pct(D.honest/D.total)}).</div>`;
  if(emoRank.length){const lo=emoRank[0],lomode=Object.entries(lo[2].modes).filter(([k])=>k!=="direct").sort((a,b)=>b[1]-a[1])[0];
    h+=`<div class="find">The emotion least likely to come out as itself is <b>${EMO[lo[0]]}</b>: direct in ${lo[2].modes.direct||0} of ${lo[2].n} situations${lomode?`; it mostly shows up as <b>${MODE[lomode[0]]}</b>`:""}.</div>`}
  if(L.cos!=null&&L.cos<0.5)h+=`<div class="find warn">Give and receive languages don't line up (similarity ${L.cos.toFixed(2)} on 0–1).</div>`;
  if(CT.length)h+=`<div class="find bad"><b>Log contradicts questionnaire:</b><ul style="margin:4px 0 0 16px">${CT.map(c=>`<li>${c}</li>`).join("")}</ul></div>`;
  if(topIns&&topDec&&topIns[1].n>=3&&topDec[1].n>=2)h+=`<p class="muted">Read together: the schema supplies the threat, the method is the reflex that manages it, the context is where the threat is most live. <b>${SCHEMA[topIns[0]].n}</b> → <b>${DEC[topDec[0]].n}</b>${leastHonest?` → <b>${CTX[leastHonest[0]]}</b>`:""}${emoRank.length?` → <b>${EMO[emoRank[0][0]]}</b> is the emotion with the lowest direct-expression rate`:""}.</p>`;
  h+=`</div>`;

  /* insecurities */
  h+=`<div class="card"><h2>Insecurities (schema evidence)</h2><p class="muted">Posterior probability from a ${pct(PRIOR)} prior plus log-odds per answer. Over 50%: evidence favors it. Under 25%: answers argued against it. ${prev?"Pink marker = last snapshot.":""}</p>`;
  for(const [k,s] of insRank)h+=bar(SCHEMA[k].n,s.post,`${pct(s.post)} · n=${s.n}${prev?` · Δ${((s.post-prev.I[k].post)*100).toFixed(0)}`:""}`,s.post>=.5?"":s.post<.25?"ok":"warn",prev?prev.I[k].post:null);
  for(const [k,s] of insRank.slice(0,3)){if(s.post<0.4||!s.ev.length)continue;
    h+=`<h3>${SCHEMA[k].n}</h3><p class="muted">${SCHEMA[k].d}</p>${evList(s.ev.sort((a,b)=>b.w-a.w))}${LG.sch[k]?`<div class="ev"><b>${LG.sch[k]} logged incident${LG.sch[k]>1?"s":""} tagged with this trigger</b></div>`:""}`}
  h+=`</div>`;

  /* deception */
  h+=`<div class="card"><h2>Deception: methods and contexts</h2><p class="muted">Counts of scored situations per method (primary 1, secondary 0.5). Method entropy ${D.H.toFixed(2)} of ${D.Hmax.toFixed(2)} bits: ${D.H<1.8?"low, a few habitual moves":D.H<2.6?"moderate":"high, varies by situation"}. Intent is not measured; a method label records the shape of the gap between what was said and what was true.</p>`;
  const maxn=Math.max(1,...decRank.map(x=>x[1].n));
  for(const [k,s] of decRank)h+=bar(DEC[k].n,s.n/maxn,`${s.n}${LG.m[k]?` · log ${LG.m[k]}`:""}${prev?` · Δ${(s.n-prev.D.m[k].n).toFixed(1)}`:""}`,"",prev?prev.D.m[k].n/maxn:null);
  h+=`<h3>By context</h3><table><tr><th>context</th><th>straight (questionnaire)</th><th>rate</th><th>straight (log)</th><th>dominant method</th></tr>`;
  for(const c in CTX){const x=D.ctx[c];if(!x.total&&!LG.ctx[c].total)continue;const dm=Object.entries(x.methods).sort((a,b)=>b[1]-a[1])[0];
    h+=`<tr><td>${CTX[c]}</td><td class="num">${x.honest}/${x.total}</td><td class="num">${x.total?pct(x.honest/x.total):"–"}</td><td class="num">${LG.ctx[c].total?LG.ctx[c].straight+"/"+LG.ctx[c].total:"–"}</td><td>${dm?DEC[dm[0]].n+" ("+dm[1]+")":"—"}</td></tr>`}
  h+=`</table><p class="muted">Spread across contexts: SD ${D.sd.toFixed(2)} (${D.sd<0.15?"consistent across settings":D.sd<0.3?"context-dependent":"very different by setting"}). Self-deception ${pct(D.selfDeception)} vs other-directed ${pct(D.otherDeception)}${D.selfDeception!=null&&D.otherDeception!=null?(D.selfDeception>D.otherDeception+0.15?": lower straight rate on internal items than on interpersonal ones.":D.otherDeception>D.selfDeception+0.15?": higher straight rate on internal items than on interpersonal ones.":": roughly equal."):"."}</p>`;
  for(const [k,s] of decRank.slice(0,3)){if(s.n<1.5)continue;const cs=Object.entries(s.ctx).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`${CTX[c]} (${n})`).join(", ");
    h+=`<h3>${DEC[k].n}</h3><p class="muted">${DEC[k].d}${cs?` Shows up with: ${cs}.`:""}</p>${evList(s.ev)}`}
  h+=`</div>`;

  /* love */
  h+=`<div class="card"><h2>Love language</h2><div class="grid2"><div><h3>Needs to receive (n=${L.nr})</h3>`;
  for(const k in LOVE)h+=bar(LOVE[k],L.nr?L.r[k]/L.nr:0,`${L.r[k]}`);
  h+=`</div><div><h3>Gives (n=${L.ng})</h3>`;
  for(const k in LOVE)h+=bar(LOVE[k],L.ng?L.g[k]/L.ng:0,`${L.g[k]}`,"ok");
  h+=`</div></div>`;
  const rTop=Object.entries(L.r).sort((a,b)=>b[1]-a[1])[0],gTop=Object.entries(L.g).sort((a,b)=>b[1]-a[1])[0];
  const defs=Object.entries(L.d).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  h+=`<p class="muted">Give/receive cosine ${L.cos==null?"–":L.cos.toFixed(2)}. Concentration (Herfindahl, 0.2 flat → 1.0 single) ${L.hhi==null?"–":L.hhi.toFixed(2)}${L.hhi!=null?(L.hhi>=0.4?", a clear primary language.":L.hhi>=0.28?", a lead language with a second.":", spread out."):""}</p>`;
  if(rTop&&gTop&&rTop[1]>0&&gTop[1]>0)h+=`<div class="find ${rTop[0]===gTop[0]?"ok":"warn"}">Most needs <b>${LOVE[rTop[0]]}</b>, most gives <b>${LOVE[gTop[0]]}</b>.${rTop[0]===gTop[0]?" Same language both directions.":" Others receive "+LOVE[gTop[0]].toLowerCase()+"; the questionnaire says "+LOVE[rTop[0]].toLowerCase()+" is what is needed."}</div>`;
  if(defs.length)h+=`<div class="find">Reported as not given: <b>${defs.map(x=>LOVE[x[0]]).join(", ")}</b>.${L.r[defs[0][0]]>0?" "+LOVE[defs[0][0]]+" is also scored as needed; same language on both the need and the deficit side.":""}</div>`;
  h+=`</div>`;

  /* emotion */
  h+=`<div class="card"><h2>Emotion: what comes out as itself</h2><p class="muted">Direct-expression rate ${pct(E.directRate)} (n=${E.N})${prev?` (was ${pct(prev.E.directRate)})`:""}; suppression + withdrawal ${pct(E.suppressRate)}.</p>
  <table><tr><th>emotion</th><th>direct</th><th>rate</th><th>where the rest goes</th><th>log</th></tr>`;
  for(const k in EMO){const e=E.e[k];if(!e.n)continue;const d=e.modes.direct||0;
    const rest=Object.entries(e.modes).filter(([mo])=>mo!=="direct").sort((a,b)=>b[1]-a[1]).map(([mo,n])=>`${MODE[mo]} ×${n}`).join(", ");
    const lg=LG.emo[k];h+=`<tr><td>${EMO[k]}</td><td class="num">${d}/${e.n}</td><td class="num">${pct(d/e.n)}</td><td>${rest||"—"}</td><td class="num">${lg?(lg.modes.direct||0)+"/"+lg.n+" direct":"–"}</td></tr>`}
  h+=`</table>`;
  const genuine=Object.entries(E.e).filter(([k,e])=>e.n>=2&&(e.modes.direct||0)/e.n>=0.5).map(([k])=>EMO[k]);
  const masked=Object.entries(E.e).filter(([k,e])=>e.n>=2&&(e.modes.direct||0)/e.n<0.34).map(([k])=>EMO[k]);
  if(genuine.length)h+=`<div class="find ok">Direct at least half the time: <b>${genuine.join(", ")}</b>.</div>`;
  if(masked.length)h+=`<div class="find">Direct less than a third of the time: <b>${masked.join(", ")}</b>.</div>`;
  const conv=[];for(const k in EMO){const e=E.e[k];for(const mo in e.modes){if(["anger","tears","worry","shame","control"].includes(mo))conv.push(`${EMO[k]} → ${MODE[mo].replace("converted to ","")} (${e.modes[mo]})`)}}
  if(conv.length)h+=`<p class="muted">Conversions (primary shown as secondary): ${conv.join("; ")}.</p>`;
  const toldM=Object.entries(E.told);if(toldM.length)h+=`<p class="muted">Others have named: ${toldM.map(([mo])=>MODE[mo]).join(", ")}.</p>`;
  for(const k in EMO){const e=E.e[k];if(e.n<2||(e.modes.direct||0)/e.n>=0.5)continue;h+=`<h3>${EMO[k]}</h3>${evList(e.ev.filter(x=>x.mo!=="direct"))}`}
  h+=`</div>`;

  /* screens */
  if(SC.phqN||SC.gadN||SC.anxN){h+=`<div class="card"><h2>Screens</h2><table><tr><th>measure</th><th>score</th><th>band</th><th>note</th></tr>`;
    if(SC.phqN)h+=`<tr><td>PHQ-9 depression (${SC.phqN}/9 items)</td><td class="num">${SC.phq}</td><td>${SC.phqN===9?SC.phqBand:"incomplete"}</td><td>${SC.phq>=10?"10+ is the usual threshold for a clinician to assess further.":"below the usual referral threshold"}${SC.phq9>0?" <b style='color:#ff5f5f'>Item 9 (thoughts of being better off dead or self-harm) was endorsed. That item alone warrants talking to a professional or a crisis line now, regardless of the total.</b>":""}</td></tr>`;
    if(SC.gadN)h+=`<tr><td>GAD-7 anxiety (${SC.gadN}/7 items)</td><td class="num">${SC.gad}</td><td>${SC.gadN===7?SC.gadBand:"incomplete"}</td><td>${SC.gad>=10?"10+ is the usual threshold for further assessment.":"below the usual referral threshold"}</td></tr>`;
    if(SC.anxN)h+=`<tr><td>Attachment anxiety (1–7)</td><td class="num">${SC.anx.toFixed(2)}</td><td>${SC.anx>=4?"high":"low"}</td><td rowspan="2">${attachStyle(SC.anx,SC.avo)||""}. Attachment anxiety tracks the Abandonment schema; avoidance tracks Emotional Deprivation and suppression. Check they agree.</td></tr><tr><td>Attachment avoidance (1–7)</td><td class="num">${SC.avo.toFixed(2)}</td><td>${SC.avo>=4?"high":"low"}</td></tr>`;
    h+=`</table><p class="tiny">PHQ-9 and GAD-7 are public domain (Pfizer). Attachment items are adapted from the two-dimension model behind the ECR, not the ECR itself; no published norms apply to them.</p></div>`}

  /* orientation */
  h+=renderOrientCard(r);
  /* gaslighting */
  if(answered(QG,r)+answered(QGT,r)>=4||sub.msgGL)h+=renderGLCard(r,sub);
  /* message evidence */
  if(sub.msg&&sub.msg.length)h+=renderMsgResults(sub.msg,false);
  /* blind spots */
  h+=`<div class="card"><h2>Blind spots: self-view vs behavior</h2><p class="muted">Each self-statement (true = 1, false = 0) against what the behavioral items measured. Gap over 0.3 marks a place where the self-description and the reported behavior disagree.</p><table><tr><th>statement</th><th>self</th><th>behavior</th><th>gap</th><th></th></tr>`;
  const sv=id=>r.a[id]==null?null:r.a[id];
  const rows=[["S1","Honest, don't really lie",D.total?D.honest/D.total:null],
    ["S2","Few insecurities",(()=>{const v=Object.values(I).filter(s=>s.n>=2);return v.length?1-v.filter(s=>s.post>=.5).length/v.length:null})()],
    ["S3","People always know how I feel",E.directRate],
    ["S4","When angry, people know",E.e.anger.n?(E.e.anger.modes.direct||0)/E.e.anger.n:null],
    ["S5","Know what makes me feel loved",L.hhi==null?null:Math.min(1,(L.hhi-0.2)/0.4)],
    ["S6","Same person in every setting",D.total?Math.max(0,1-D.sd*2.5):null]];
  for(const [id,lab,beh] of rows){const s=sv(id);if(s==null||beh==null)continue;const gap=s-beh;
    h+=`<tr><td>${lab}</td><td class="num">${s.toFixed(2)}</td><td class="num">${beh.toFixed(2)}</td><td class="num">${gap>0?"+":""}${gap.toFixed(2)}</td><td>${Math.abs(gap)>0.3?(gap>0?"<span style='color:var(--warn)'>self-view higher than behavior</span>":"<span style='color:var(--acc)'>self-view lower than behavior</span>"):"<span class='tiny'>consistent</span>"}</td></tr>`}
  h+=`</table></div>`;

  /* change since snapshot */
  if(prev){h+=`<div class="card"><h2>Change since snapshot (${new Date(snap.ts).toLocaleDateString()})</h2><p class="muted">Reliable change is flagged when a posterior moved 0.20 or more, or a rate moved 0.25 or more on at least 4 items. Smaller movements are within the noise of this instrument.</p><table><tr><th>measure</th><th>then</th><th>now</th><th>Δ</th><th></th></tr>`;
    const rows2=[];
    for(const k in SCHEMA)rows2.push([SCHEMA[k].n,prev.I[k].post,I[k].post,0.2]);
    rows2.push(["Straight-answer rate",prev.D.total?prev.D.honest/prev.D.total:null,D.total?D.honest/D.total:null,0.25]);
    rows2.push(["Direct emotional expression",prev.E.directRate,E.directRate,0.25]);
    rows2.push(["Suppression + withdrawal",prev.E.suppressRate,E.suppressRate,0.25]);
    rows2.push(["Give/receive similarity",prev.L.cos,L.cos,0.25]);
    for(const [lab,a,b,th] of rows2){if(a==null||b==null)continue;const d=b-a;h+=`<tr><td>${lab}</td><td class="num">${a.toFixed(2)}</td><td class="num">${b.toFixed(2)}</td><td class="num">${d>0?"+":""}${d.toFixed(2)}</td><td>${Math.abs(d)>=th?`<b style="color:${(lab.startsWith("Supp")?d<0:lab.match(/Straight|Direct|Give/)?d>0:d<0)?"var(--ok)":"var(--neon)"}">reliable change</b>`:"<span class='tiny'>noise</span>"}</td></tr>`}
    h+=`</table></div>`}

  /* plan adherence */
  const plan=sub.plan;if(plan&&plan.length){const ci=sub.checkins;let done=0,tot=0;for(const k of plan){for(const d in (ci[k]||{})){tot++;if(ci[k][d].done)done++}}
    h+=`<div class="card"><h2>Change plan adherence</h2><p class="muted">${plan.length} modules active · ${done}/${tot} check-ins done (${tot?pct(done/tot):"–"}). ${tot<14?"Fewer than 14 check-ins; too early to retest.":"Enough check-ins to retest: save a snapshot and redo the questionnaire."}</p></div>`}

  if(sub.notes.length){h+=`<div class="card"><h2>Notes (unscored)</h2>`;for(const n of sub.notes)h+=`<div class="note"><div class="h"><span class="pill">${n.dom}</span><span class="tiny">${esc(n.who||"")}</span></div>${esc(n.txt)}</div>`;h+=`</div>`}
  h+=`<div class="card"><p class="tiny">Coverage: insecurity ${answered(QI)}/${QI.length}, deception ${answered(QD)}/${QD.length}, love ${answered(QL)}/${QL.length}, emotion ${answered(QE)}/${QE.length}, screens ${scrN()}/${SCR_TOTAL}, validity ${answered(QV)+answered(QX)}/${QV.length+QX.length}, self-view ${answered(QS)}/${QS.length}, disputes ${answered(QG)+answered(QGT)}/${QG.length+QGT.length}, orientation ${answered(QO)}/${QO.length}, message threads ${(sub.msg||[]).length}, told-by-others ${Object.values(r.told).filter(Boolean).length}, logged incidents ${sub.log.length}. Structured self/observer report, not a clinical instrument. Arithmetic is exact; item weights are author-assigned, not norm-referenced; screens carry their published cutoffs.</p></div>`;
  m.innerHTML=h;
}

/* ---------- COMPARE RATERS ---------- */
function vCompare(m){
  const sub=S(),raters=Object.entries(sub.raters).filter(([id,r])=>answered(QI,r)+answered(QD,r)+answered(QE,r)>=8);
  if(raters.length<2){m.innerHTML=`<div class="card"><h2>Compare raters</h2><p class="muted">Needs at least two raters with answers for this subject (Self plus one observer). Add an observer with the header button; they answer the same items about ${esc(DB.cur.s)}.</p></div>`;return}
  const sc=raters.map(([id,r])=>({id,r,I:scoreInsecurity(r),D:scoreDeception(r),E:scoreEmotion(r),L:scoreLove(r)}));
  const self=sc.find(x=>x.r.kind==="self"),obs=sc.filter(x=>x.r.kind==="observer");
  let h=`<div class="card"><h2>Compare raters: ${esc(DB.cur.s)}</h2><p class="muted">Vazire's model: the self knows internal states best; observers see evaluative behavior (honesty, defensiveness, how emotion comes out) more accurately. Where raters agree, treat it as confirmed. Where they disagree, that is the blind spot, shown item by item so it can be argued at the item level.</p>`;
  // item-level agreement
  if(self&&obs.length){
    for(const o of obs){let agree=0,n=0;const dis=[];
      const all=[...QI,...QD,...QE,...QL];
      for(const q of all){for(let j=0;j<q.o.length;j++){const a=opt(self.r,q,j),b=opt(o.r,q,j);if(a==null||b==null)continue;n++;if(a===b)agree++;else dis.push({q,j,a,b})}}
      h+=`<h3>Self vs ${esc(o.r.label)}</h3><p>Statement agreement <b>${n?pct(agree/n):"–"}</b> on ${n} shared statements. ${n&&agree/n<0.5?"Below half. Per Vazire (2010), observer accuracy exceeds self-accuracy for visible, evaluative behavior; weight the observer on deception and expression items.":n&&agree/n<0.7?"Moderate agreement.":"High agreement."}</p>`;
      // trait-level table
      h+=`<table><tr><th>trait</th><th>self</th><th>${esc(o.r.label)}</th><th>gap</th></tr>`;
      const rows=[];for(const k in SCHEMA)rows.push([SCHEMA[k].n,self.I[k].post,o.I[k].post]);
      rows.push(["Straight-answer rate",self.D.total?self.D.honest/self.D.total:null,o.D.total?o.D.honest/o.D.total:null]);
      rows.push(["Direct emotional expression",self.E.directRate,o.E.directRate]);
      let sum=0,cnt=0;
      for(const [lab,a,b] of rows){if(a==null||b==null)continue;const g=b-a;sum+=Math.abs(g);cnt++;h+=`<tr><td>${lab}</td><td class="num">${a.toFixed(2)}</td><td class="num">${b.toFixed(2)}</td><td class="num" style="color:${Math.abs(g)>=0.25?"var(--warn)":"inherit"}">${g>0?"+":""}${g.toFixed(2)}</td></tr>`}
      h+=`</table><p class="muted">Self-other discrepancy index (mean |gap|): <b>${cnt?(sum/cnt).toFixed(2):"–"}</b>. Above 0.25 is a large blind-spot load.</p>`;
      if(dis.length){h+=`<p class="tiny">disagreements (${dis.length}):</p>`;for(const d of dis.slice(0,40))h+=`<div class="ev"><span class="src">${esc(d.q.t)}</span><br>${esc(d.q.o[d.j].t)}<br><b>self:</b> ${d.a?"true":"false"} · <b>${esc(o.r.label)}:</b> ${d.b?"true":"false"}</div>`}
    }
  } else h+=`<p class="muted">Only observers have answered; a Self rating is needed to compute blind spots. Observer-only profiles are still valid as evidence; see Results for each.</p>`;
  h+=`</div>`;m.innerHTML=h;
}

/* ---------- CHANGE PLAN ---------- */
function suggestModules(){
  const r=S().raters.self,keys=[];
  const rs=Object.values(S().raters).filter(x=>answered(QI,x)>=5);
  if(!rs.length)return keys;
  // aggregate across raters: mean posterior, summed method counts, summed modes
  const agg={I:{},D:{},M:{},cos:[]};
  for(const x of rs){const I=scoreInsecurity(x),D=scoreDeception(x),E=scoreEmotion(x),L=scoreLove(x);
    for(const k in I)agg.I[k]=(agg.I[k]||0)+I[k].post/rs.length;for(const k in D.m)agg.D[k]=(agg.D[k]||0)+D.m[k].n;
    for(const mo in E.modeTot)agg.M[mo]=(agg.M[mo]||0)+E.modeTot[mo];if(L.cos!=null)agg.cos.push(L.cos)}
  const ti=Object.entries(agg.I).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>=0.5).slice(0,2).map(x=>x[0]);
  const td=Object.entries(agg.D).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>=2).slice(0,2).map(x=>x[0]);
  const tm=Object.entries(agg.M).filter(([mo])=>mo!=="direct"&&MODES_WITH_MODULE.includes(mo)).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>=3).slice(0,1).map(x=>"m_"+x[0]);
  keys.push(...ti,...td,...tm);
  if(agg.cos.length&&agg.cos.reduce((a,b)=>a+b,0)/agg.cos.length<0.5)keys.push("love");
  if(rs.some(x=>["recurrent","pervasive"].includes(scoreGL(x).actorBand)))keys.unshift("GLA");
  return keys.slice(0,5);
}
const MODES_WITH_MODULE=["anger","suppress","withdraw","humor","somatic","displace"];
function vPlan(m){
  const sub=S();const sug=suggestModules();
  if(!sub.plan)sub.plan=[];
  const today=new Date().toISOString().slice(0,10);
  let h=`<div class="card"><h2>Change plan</h2><p class="muted">One two-week behavioral experiment per finding, drawn from schema therapy, CBT, and DBT. Each has a daily check-in. The plan is assigned from results (aggregated across raters), and you can add or remove modules. Adherence and retest readiness show in Results. Change is measured, not assumed: after 14+ check-ins, save a snapshot and redo the questionnaire.</p>
  <div class="row"><button class="primary" onclick="S().plan=${JSON.stringify(sug).replace(/"/g,"&quot;")};save();render()">Assign from results (${sug.length})</button>
  <select id="addMod"><option value="">add a module…</option>${Object.entries(MODULES).map(([k,v])=>`<option value="${k}">${esc(v.n)} — ${k.startsWith("m_")?MODE[k.slice(2)]:SCHEMA[k]?SCHEMA[k].n:DEC[k]?DEC[k].n:k==="GLA"?"disputes":"love language"}</option>`).join("")}</select>
  <button onclick="const k=document.getElementById('addMod').value;if(k&&!S().plan.includes(k)){S().plan.push(k);save();render()}">Add</button></div></div>`;
  for(const k of sub.plan){const M=MODULES[k];if(!M)continue;const ci=sub.checkins[k]=sub.checkins[k]||{};
    const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10))}
    const done=Object.values(ci).filter(x=>x.done).length,tot=Object.keys(ci).length;
    h+=`<div class="mod"><div class="row"><h4>${esc(M.n)}</h4><span class="pill">${k.startsWith("m_")?MODE[k.slice(2)]:SCHEMA[k]?SCHEMA[k].n:DEC[k]?DEC[k].n:k==="GLA"?"disputes":"love language"}</span><span class="spacer"></span><span class="tiny">${done}/${tot} done</span><button class="danger sm" onclick="S().plan=S().plan.filter(x=>x!=='${k}');save();render()">remove</button></div>
    <p class="muted" style="margin:4px 0"><b>Why:</b> ${esc(M.why)}</p><p style="margin:4px 0"><b>Do:</b> ${esc(M.do)}</p>
    <p style="margin:4px 0"><b>Today (${today}):</b> ${esc(M.check)} <button class="sm ${ci[today]?.done?"primary":""}" onclick="ck('${k}','${today}',true)">yes</button> <button class="sm ${ci[today]&&!ci[today].done?"danger":""}" onclick="ck('${k}','${today}',false)">no</button>
    <input type="text" placeholder="what happened (optional)" value="${esc(ci[today]?.note||"")}" onchange="ckNote('${k}','${today}',this.value)" style="width:60%"></p>
    <div class="ci">${days.map(d=>`<span class="${ci[d]?(ci[d].done?"y":"n"):""}" title="${d}${ci[d]?.note?": "+esc(ci[d].note):""}">${d.slice(8)}</span>`).join("")}</div></div>`}
  if(!sub.plan.length)h+=`<div class="card"><p class="muted">No modules assigned. Click "Assign from results" once there are answers, or add modules by hand.</p></div>`;
  m.innerHTML=h;
}
function ck(k,d,v){const ci=S().checkins[k]=S().checkins[k]||{};ci[d]=Object.assign(ci[d]||{},{done:v});save();render()}
function ckNote(k,d,v){const ci=S().checkins[k]=S().checkins[k]||{};ci[d]=Object.assign(ci[d]||{done:false},{note:v});save()}
/* ---- views/method.js ---- */
/* Method tab: how every number on the report is produced. */


/* ---------- METHOD ---------- */
function vMethod(m){
  m.innerHTML=`<div class="card"><h2>Method</h2>
  <h3>What this is and isn't</h3>
  <p>A structured behavioral self- and observer-report with transparent arithmetic. It is not a diagnostic instrument: diagnosis needs a clinician, an interview, and norm-referenced tests. The two screens included (PHQ-9, GAD-7) are the public-domain ones clinicians actually use for first-pass screening, with their published cutoffs; the rest of the item bank is author-written from the models below and its weights are not normed. Ranks, gaps, and change within one subject are the meaningful outputs; absolute numbers across subjects are not comparable.</p>
  <h3>Insecurities: Young's Early Maladaptive Schemas</h3>
  <p>Schema therapy (Young, Klosko &amp; Weishaar, 2003) describes 18 stable belief patterns; ten are used. Items are behavioral rather than the YSQ's direct self-statements because a person without insight won't endorse "I am fundamentally flawed" but will report deleting a post that got no response.</p>
  <pre class="math">posterior = σ( logit(0.25) + Σ LLR )
LLR: +1.1 primary option (≈ ×3 likelihood), +0.4…0.9 secondary, −0.35 when an item tested the schema and another option was chosen
told-by-others: +0.6…0.9, marked external</pre>
  <h3>Deception: Interpersonal Deception Theory, defenses, contexts</h3>
  <p>Buller &amp; Burgoon (1996): falsification, concealment, equivocation. DePaulo et al. (1996): everyday lying is frequent and varies by relationship. Vaillant and the DSQ (Andrews et al., 1993): minimization, rationalization, projection, denial, humor. Paulhus (1984): self-deception vs impression management. <b>Intent is not measured.</b> An observer scores a non-straight option only after recording that it turned out otherwise; unverified items are counted and excluded.</p>
  <pre class="math">count(method) = Σ 1.0 primary + 0.5 secondary, scored items only
straight rate(context) = straight / scored items in context
context SD = √ mean (rate_c − mean)²      ; ≥0.30 = markedly different by setting
entropy H = −Σ p_k log₂ p_k                ; max 3.32 bits
self-deception = 1 − straight rate in "yourself" items</pre>
  <h3>Love language: Chapman, ipsative</h3>
  <p>Five languages as a forced-choice vocabulary (weak as five independent factors, useful as a language). Give side added because the common failure is giving in one's own language.</p>
  <pre class="math">cosine(give, receive) = g·r / (‖g‖‖r‖)   ; Herfindahl = Σ (r_k/n)²</pre>
  <h3>Emotion: Gross, Greenberg, Lieberman</h3>
  <p>Gross (1998): expressive suppression fails to reduce the felt emotion and leaks. Greenberg: secondary emotions mask primary ones (anger over fear). Lieberman et al. (2007): affect labeling reduces amygdala response, which is why the modules ask for the word out loud.</p>
  <pre class="math">direct rate(e) = direct / items for e ; genuine ≥ 0.50 ; masked < 0.34 (n ≥ 2)
suppression index = (suppress + withdraw) / all emotion items</pre>
  <h3>Orientation: paired statements</h3>
  <p>Domains follow the Klein Sexual Orientation Grid (Klein, Sepekoff &amp; Wolf 1985): behavior, attraction, emotional preference, ideal, self-label, plus concealment and sought-vs-offered. Each statement is asked for the same sex and for the other sex. A domain's position is the ratio of true counts placed on Kinsey's 0–6 scale. The report states positions and gaps; it does not assign an orientation, which the literature treats as self-defined.</p>
  <pre class="math">position = 6 × same_true ÷ (same_true + other_true)
gap flagged when |a − b| ≥ 1.5 (a quarter of the scale)</pre>
  <h3>Format</h3>
  <p>Every item is a true/false statement. A situation is shown once and each thing a person might do in it is a separate statement, so several can be true. Scoring counts true statements; a statement left blank is not scored. True/false formats are vulnerable to acquiescence (marking true regardless of content), so the validity section measures the share of statements marked true across the whole instrument.</p>
  <h3>Validity</h3>
  <p>Lie scale modeled on MMPI-L and Marlowe-Crowne: virtues almost nobody can truthfully claim. Inconsistency modeled on MMPI VRIN: reworded items whose categories should match. Stamp rules:</p>
  <pre class="math">invalid      : lie ≥ 6/8  or  inconsistency ≥ 3/6
questionable : lie ≥ 4/8  or  inconsistency ≥ 2/6  or  (straight ≥ 85% on ≥12 items and lie ≥ 3)
questionable : true on ≥ 75% or ≤ 6% of statements (n ≥ 60), acquiescence / nay-saying
valid        : otherwise</pre>
  <h3>Observers and blind spots</h3>
  <p>Vazire's SOKA model (2010): self-accuracy is highest for internal, low-evaluative traits; other-accuracy is highest for visible, evaluative traits. Deception and emotional expression are visible and evaluative, so observer reports are weighted there. Item agreement is computed on category (method, mode, language), not option index. Self-other discrepancy index = mean absolute gap across schema posteriors, straight rate, and direct-expression rate.</p>
  <h3>Incident log and contradictions</h3>
  <p>Ecological momentary assessment logic: events recorded near the moment beat retrospective generalization. The log is coded with the same categories. A contradiction is flagged when the questionnaire's straight rate in a context exceeds the log's by 0.40 or more, when a method appears twice in the log but never in the questionnaire, when a schema is tagged twice in the log but scores under 30%, or when an emotion's direct rate differs by 0.40 or more.</p>
  <h3>Change</h3>
  <p>Snapshots freeze answers. Reliable change: |Δ posterior| ≥ 0.20, or |Δ rate| ≥ 0.25 with n ≥ 4, which approximates a reliable-change criterion for an instrument of this length. Modules are behavioral experiments in the schema-therapy sense: the schema makes a prediction, the experiment tests it, the log records the outcome. Adherence is counted; 14 check-ins is the minimum before a retest means anything.</p>
  <h3>Screens</h3>
  <p>PHQ-9 (Kroenke, Spitzer &amp; Williams, 2001) bands: 0–4 minimal, 5–9 mild, 10–14 moderate, 15–19 moderately severe, 20–27 severe; item 9 is a self-harm flag on its own. GAD-7 (Spitzer et al., 2006) bands: 0–4, 5–9, 10–14, 15–21. Attachment items are adapted to the anxiety/avoidance model behind the ECR (Brennan, Clark &amp; Shaver, 1998) and are not the ECR; the 4.0 split is a convention, not a norm.</p>
  </div>`;
}
